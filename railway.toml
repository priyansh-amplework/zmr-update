# Deploy from git root: application code is in `zmr-update/`.
# Alternative: set Railway service "Root Directory" to `zmr-update` and delete this file
# in favor of `zmr-update/railway.toml`.
#
# Backend (FastAPI): matches `zmr-update/railway.api-only.toml` with `cd` into the app folder.

[build]
builder = "NIXPACKS"

[deploy]
# Double quotes inside sh -c so $PORT expands (single quotes would pass the literal "$PORT" to uvicorn).
startCommand = "sh -c \"cd zmr-update && exec python -m uvicorn zmr_brain.api:app --host 0.0.0.0 --port $PORT\""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
